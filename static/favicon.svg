<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1a1a2e"/>
  <!-- Castle base -->
  <rect x="18" y="35" width="28" height="20" fill="#6b6b6b"/>
  <!-- Towers -->
  <rect x="14" y="25" width="10" height="30" fill="#5a5a5a"/>
  <rect x="40" y="25" width="10" height="30" fill="#5a5a5a"/>
  <!-- Tower tops -->
  <polygon points="14,25 19,15 24,25" fill="#4a3728"/>
  <polygon points="40,25 45,15 50,25" fill="#4a3728"/>
  <!-- Center tower -->
  <rect x="26" y="20" width="12" height="25" fill="#7a7a7a"/>
  <polygon points="26,20 32,8 38,20" fill="#4a3728"/>
  <!-- Flag -->
  <line x1="32" y1="8" x2="32" y2="4" stroke="#8B4513" stroke-width="1"/>
  <polygon points="32,4 42,7 32,10" fill="url(#gold)"/>
  <!-- Gate -->
  <rect x="28" y="45" width="8" height="10" rx="4" fill="#2a2a2a"/>
  <!-- Battlements -->
  <rect x="18" y="33" width="4" height="4" fill="#5a5a5a"/>
  <rect x="26" y="33" width="4" height="4" fill="#5a5a5a"/>
  <rect x="34" y="33" width="4" height="4" fill="#5a5a5a"/>
  <rect x="42" y="33" width="4" height="4" fill="#5a5a5a"/>
</svg>
